<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumo · viagem em grupo</title>
<meta name="description" content="Roteiro, mapa, reservas, contas e documentos da viagem — para a família toda, até sem internet.">
<meta name="theme-color" content="#f8f8f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rumo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* =====================================================================
   Rumo v1.3 · visual "Linha" (claro) + "Grafite" (escuro)
   Regras: texto 15px, botões 40px (44px nas ações principais), linhas finas
   em vez de sombras, uma cor de destaque, emojis só no conteúdo.
   ===================================================================== */

/* ---------- Paletas (Ajustes → Aparência). Só mudam a cor de destaque e o tom do fundo ---------- */
:root{
  --p-papel:#f8f8f9; --p-cartao:#ffffff; --p-cartao2:#f2f3f5; --p-tinta:#0e1116; --p-tinta2:#5b616e; --p-tinta3:#8a909b; --p-linha:#e8e9ec;
  --p-acao:#2445c4; --p-acao-suave:#eaeefb; --p-acao-e:#e3a857; --p-acao-e-txt:#17130c;
}
:root[data-paleta="grafite"]{ --p-acao:#0e1116; --p-acao-suave:#eceef1; --p-acao-e:#eceef1; --p-acao-e-txt:#111214; }
:root[data-paleta="oceano"]{ --p-papel:#f6f9fa; --p-cartao2:#edf3f4; --p-linha:#e2eaec; --p-acao:#0f6e6e; --p-acao-suave:#e1f0f0; --p-acao-e:#6cc6c6; --p-acao-e-txt:#06201f; }
:root[data-paleta="floresta"]{ --p-papel:#f7f8f6; --p-cartao2:#eff2ec; --p-linha:#e3e7df; --p-acao:#2f6b3f; --p-acao-suave:#e3efe5; --p-acao-e:#9ed3b4; --p-acao-e-txt:#0a2213; }
:root[data-paleta="terracota"]{ --p-papel:#faf8f6; --p-cartao2:#f4efea; --p-linha:#ebe4dd; --p-acao:#b4532a; --p-acao-suave:#f7e6dd; --p-acao-e:#e89a8f; --p-acao-e-txt:#2a0f08; }
:root[data-paleta="ameixa"]{ --p-papel:#f9f8fa; --p-cartao2:#f2eff5; --p-linha:#e7e2ec; --p-acao:#6b3e8c; --p-acao-suave:#efe6f6; --p-acao-e:#c6a3e6; --p-acao-e-txt:#1d0b2e; }
:root[data-paleta="rosa"]{ --p-papel:#fbf8f9; --p-cartao2:#f6eff1; --p-linha:#eee2e6; --p-acao:#a8326a; --p-acao-suave:#f8e4ee; --p-acao-e:#eea3c6; --p-acao-e-txt:#2b0716; }
:root[data-paleta="caderno"]{ --p-papel:#f6f4ef; --p-cartao:#fffdf9; --p-cartao2:#efebe3; --p-tinta:#1e1b16; --p-tinta2:#6a6257; --p-tinta3:#8c8478; --p-linha:#e6e1d8; --p-acao:#3e6b57; --p-acao-suave:#e4eee8; --p-acao-e:#e3a857; --p-acao-e-txt:#17130c; }

/* ---------- Fontes. Padrão: Geist (carregada no <head>) ---------- */
:root{
  --fonte:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  --titulo:var(--fonte); --peso-titulo:600; --espaco-titulo:-.015em;
}
:root[data-fonte="sistema"]{ --fonte:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace; }
:root[data-fonte="inter"]{ --fonte:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
:root[data-fonte="plex"]{ --fonte:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
:root[data-fonte="source"]{ --fonte:"Source Sans 3",-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
:root[data-fonte="classica"]{ --titulo:"Source Serif 4",Georgia,"Times New Roman",serif; --espaco-titulo:0; }
:root[data-fonte="editorial"]{ --titulo:"Fraunces",Georgia,"Times New Roman",serif; --espaco-titulo:0; }

:root{
  --papel:var(--p-papel); --cartao:var(--p-cartao); --cartao2:var(--p-cartao2); --tinta:var(--p-tinta); --tinta2:var(--p-tinta2); --tinta3:var(--p-tinta3);
  --linha:var(--p-linha); --linha-forte:color-mix(in srgb,var(--p-linha) 70%,var(--p-tinta) 8%); --acao:var(--p-acao); --acao-txt:#fff; --acao-suave:var(--p-acao-suave);
  --ok:#1f7a45; --ok-suave:#e3f3e9; --alerta:#9a5b00; --alerta-suave:#fdf3dc; --erro:#b42318; --erro-suave:#fdeceb; --info:#2445c4; --info-suave:#eaeefb;
  --sombra:none; --sombra-flutua:0 8px 28px rgba(14,17,22,.12);
  --raio:12px; --raio-p:8px; --borda:1px;
  --barra:60px; --topo:56px; --lateral:232px;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  color-scheme:light;
}
/* Modo escuro "Grafite" */
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]):not([data-tema="sol"]){
    --papel:#111214; --cartao:#1a1c1f; --cartao2:#222529; --tinta:#ecedee; --tinta2:#a3a8af; --tinta3:#7d828a;
    --linha:#2a2d31; --linha-forte:#33373c; --acao:var(--p-acao-e); --acao-txt:var(--p-acao-e-txt); --acao-suave:color-mix(in srgb,var(--p-acao-e) 14%,#1a1c1f);
    --ok:#7fcb97; --ok-suave:#15291d; --alerta:#e3b860; --alerta-suave:#2e2412; --erro:#f19a90; --erro-suave:#341a17; --info:#8fb8e8; --info-suave:#17233a;
    --sombra-flutua:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-tema="escuro"]{
  --papel:#111214; --cartao:#1a1c1f; --cartao2:#222529; --tinta:#ecedee; --tinta2:#a3a8af; --tinta3:#7d828a;
  --linha:#2a2d31; --linha-forte:#33373c; --acao:var(--p-acao-e); --acao-txt:var(--p-acao-e-txt); --acao-suave:color-mix(in srgb,var(--p-acao-e) 14%,#1a1c1f);
  --ok:#7fcb97; --ok-suave:#15291d; --alerta:#e3b860; --alerta-suave:#2e2412; --erro:#f19a90; --erro-suave:#341a17; --info:#8fb8e8; --info-suave:#17233a;
  --sombra-flutua:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
}
/* Modo Sol: contraste máximo para ler na rua */
:root[data-tema="sol"]{
  --papel:#ffffff; --cartao:#ffffff; --cartao2:#f2f2f2; --tinta:#000; --tinta2:#000; --tinta3:#1a1a1a;
  --linha:#000; --linha-forte:#000; --acao-suave:#eeeeee; --ok:#0b5d24; --alerta:#6b3e00; --erro:#8a0f0f; --info:#0b2f9e; --borda:2px;
}
:root[data-tema="sol"] body{font-weight:500}

/* Tamanho do texto: 15px por padrão; Ajustes → Aparência aumenta */
html{font-size:93.75%}
:root[data-letra="1"]{font-size:103.125%} :root[data-letra="2"]{font-size:112.5%} :root[data-letra="3"]{font-size:125%}

.amostra-cor{display:flex;gap:4px;justify-content:center}
.amostra-cor i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.opcao.on{outline:2px solid var(--acao);outline-offset:-1px;border-color:var(--acao)!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--papel);color:var(--tinta);font-family:var(--fonte);font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior-y:none;font-feature-settings:"tnum" 0}
button,input,select,textarea{font:inherit;color:inherit}
/* iPhone dá zoom em campos com letra menor que 16px: os campos nunca ficam abaixo disso */
input,select,textarea{font-size:max(16px,1rem)}
a{color:var(--acao);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{font-family:var(--titulo);font-weight:var(--peso-titulo);letter-spacing:var(--espaco-titulo);margin:0;line-height:1.25}
h1{font-size:1.45rem} h2{font-size:1.2rem} h3{font-size:1rem}
.mono{font-family:var(--mono)}
.peq{font-size:.87rem;color:var(--tinta2)} .mpeq{font-size:.8rem;color:var(--tinta3)}
.oculto{display:none!important}
.vazio{padding:32px 16px;text-align:center;color:var(--tinta2)}
.vazio h2{color:var(--tinta);margin-bottom:6px}
:focus-visible{outline:2px solid var(--acao);outline-offset:2px}

/* ---------- casca ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.topo{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 90%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
  padding:calc(var(--st) + 6px) 12px 6px 8px;display:flex;align-items:center;gap:8px;border-bottom:var(--borda) solid var(--linha);min-height:var(--topo)}
.viagem-btn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 6px;min-height:44px;text-align:left;cursor:pointer;border-radius:var(--raio-p)}
.viagem-btn:hover{background:var(--cartao2)}
.viagem-btn .bola{width:28px;height:28px;border-radius:8px;background:var(--acao);color:var(--acao-txt);display:grid;place-items:center;font-weight:600;font-size:.87rem;flex:none}
.viagem-btn b{display:block;font-family:var(--titulo);font-weight:600;font-size:1rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viagem-btn small{display:block;color:var(--tinta2);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pilula{border:0;background:none;border-radius:999px;padding:0 8px;min-height:32px;display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--tinta2);white-space:nowrap;cursor:pointer}
.pilula::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.pilula.off{color:var(--alerta)} .pilula.off::before{background:var(--alerta)}
.pilula.erro{color:var(--erro)} .pilula.erro::before{background:var(--erro)}
.icone-btn{width:36px;height:36px;border-radius:50%;border:var(--borda) solid var(--linha-forte);background:var(--cartao);display:grid;place-items:center;cursor:pointer;flex:none;font-size:.93rem;font-weight:500;color:var(--tinta)}
.icone-btn:hover{background:var(--cartao2)}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
main{flex:1;padding:16px 16px calc(var(--barra) + var(--sb) + 28px);width:100%;max-width:720px;margin:0 auto}
main.largo{max-width:none;padding:0}

/* barra de navegação: emojis em cinza; o ativo ganha cor */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--cartao) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:var(--borda) solid var(--linha);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding-bottom:var(--sb);height:calc(var(--barra) + var(--sb))}
.barra a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--tinta3);font-size:.73rem;font-weight:500;min-height:48px}
.barra a .ic{font-size:1.15rem;line-height:1;filter:grayscale(1);opacity:.55;transition:filter .15s,opacity .15s}
.barra a.ativo{color:var(--tinta)}
.barra a.ativo .ic{filter:none;opacity:1}
.barra .fab-casa{display:grid;place-items:center}
.fab{width:44px;height:44px;border-radius:50%;background:var(--acao);color:var(--acao-txt);border:0;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0}
.fab .ico{width:20px;height:20px;stroke-width:2}
.fab .fab-txt{display:none}
.so-pc{display:none!important}
@media (min-width:720px) and (max-width:1023px){ .barra{max-width:720px;margin:0 auto;border:var(--borda) solid var(--linha);border-bottom:0;border-radius:14px 14px 0 0} }

/* ---------- cartões e listas ---------- */
.cartao{background:var(--cartao);border:var(--borda) solid var(--linha);border-radius:var(--raio);padding:16px;margin-bottom:12px}
.cartao.toque{cursor:pointer;transition:border-color .15s}
.cartao.toque:hover{border-color:var(--linha-forte)}
.cartao h3{margin-bottom:2px}
.cartao-topo{display:flex;align-items:flex-start;gap:12px}
.cartao-topo>div{flex:1;min-width:0}
.rotulo{font-size:.73rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2);margin:22px 2px 8px}
.secao-topo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 2px 8px}
.secao-topo .rotulo{margin:0}
.secao-topo .btn{min-height:32px;padding:0 10px;font-size:.87rem}
.lista{background:var(--cartao);border:var(--borda) solid var(--linha);border-radius:var(--raio);overflow:hidden;margin-bottom:12px}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:52px;border-bottom:var(--borda) solid var(--linha);cursor:pointer;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;color:var(--tinta)}
.item:last-child{border-bottom:0}
button.item:hover,a.item:hover,.item[data-a]:hover{background:color-mix(in srgb,var(--cartao2) 60%,transparent);text-decoration:none}
.item>.corpo{flex:1;min-width:0}
.item .t{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:.87rem;color:var(--tinta2);display:block;overflow:hidden;text-overflow:ellipsis}
.item .v{font-weight:500;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.emoji{min-width:32px;width:auto;padding:0 5px;height:32px;border-radius:8px;background:var(--cartao2);display:grid;place-items:center;font-size:1rem;flex:none;line-height:1}
.emoji b{font-family:var(--mono);font-weight:500!important;font-size:.8rem!important;color:var(--tinta2)}
.etiqueta{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:.75rem;font-weight:500;background:var(--cartao2);color:var(--tinta2);white-space:nowrap}
.etiqueta.ok{background:var(--ok-suave);color:var(--ok)} .etiqueta.alerta{background:var(--alerta-suave);color:var(--alerta)} .etiqueta.erro{background:var(--erro-suave);color:var(--erro)} .etiqueta.info{background:var(--info-suave);color:var(--info)}
.pendente{opacity:.7} .pendente .t::after{content:" ⟳";font-size:.8em;color:var(--alerta)}
.grande{font-family:var(--titulo);font-size:2rem;line-height:1.05;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.medio{font-family:var(--titulo);font-size:1.4rem;line-height:1.15;font-weight:600;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.valor-pos{color:var(--ok)} .valor-neg{color:var(--erro)}
.aviso{border-radius:var(--raio-p);padding:10px 12px;font-size:.9rem;margin-bottom:12px;border:var(--borda) solid}
.aviso.alerta{background:var(--alerta-suave);border-color:color-mix(in srgb,var(--alerta) 35%,transparent);color:var(--tinta)}
.aviso.erro{background:var(--erro-suave);border-color:color-mix(in srgb,var(--erro) 35%,transparent)}
.aviso.info{background:var(--info-suave);border-color:color-mix(in srgb,var(--info) 30%,transparent)}

/* Hoje: bloco "próximo" e par hospedagem/saldo */
.proximo{padding:4px 2px 18px}
.proximo .hora{font-family:var(--mono);font-size:.87rem;color:var(--acao);font-weight:500}
.proximo h2{font-size:1.4rem;letter-spacing:-.02em;margin:2px 0 2px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--cartao);border:var(--borda) solid var(--linha);border-radius:var(--raio);margin-bottom:12px;overflow:hidden}
.duo>*{padding:14px 16px;min-width:0;color:var(--tinta);text-decoration:none;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.duo>*+*{border-left:var(--borda) solid var(--linha)}
.duo>*:hover{background:color-mix(in srgb,var(--cartao2) 60%,transparent);text-decoration:none}
.duo .rotulo{margin:0 0 4px}
.duo .codigo{font-size:.93rem}
.duo b{font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.duo.um{grid-template-columns:1fr}

/* ---------- botões e formulários ---------- */
.btn{min-height:40px;padding:0 14px;border-radius:var(--raio-p);border:var(--borda) solid var(--linha-forte);background:var(--cartao);font-weight:500;font-size:.93rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--tinta);line-height:1.2;transition:background .15s,border-color .15s}
.btn:hover{background:var(--cartao2);text-decoration:none}
.btn.prim{background:var(--acao);border-color:var(--acao);color:var(--acao-txt)}
.btn.prim:hover{background:color-mix(in srgb,var(--acao) 88%,#000)}
.btn.escuro{background:var(--tinta);border-color:var(--tinta);color:var(--papel)}
.btn.perigo{color:var(--erro);border-color:color-mix(in srgb,var(--erro) 40%,transparent)}
.btn.bloco{width:100%}
.btn.peq{min-height:32px;padding:0 10px;font-size:.87rem}
.btn[disabled]{opacity:.45;cursor:default}
.botoes{display:flex;gap:8px;flex-wrap:wrap}
.botoes .btn{flex:1 1 auto}
.botoes.compactos .btn{flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:32px;padding:0 12px;border-radius:999px;border:var(--borda) solid var(--linha-forte);background:var(--cartao);font-weight:500;font-size:.87rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--tinta)}
.chip.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.chip .pt{width:8px;height:8px;border-radius:50%;display:inline-block}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--cartao2);border-radius:10px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{min-height:32px;border:0;border-radius:7px;background:none;font-weight:500;font-size:.87rem;cursor:pointer;color:var(--tinta2)}
.seg button.on{background:var(--cartao);color:var(--tinta);box-shadow:0 0 0 1px var(--linha)}
.campo{display:block;margin-bottom:14px}
.campo>span{display:block;font-size:.82rem;font-weight:500;color:var(--tinta2);margin-bottom:5px}
.campo>span .obr{color:var(--acao)}
.campo input,.campo select,.campo textarea{width:100%;min-height:44px;border-radius:var(--raio-p);border:var(--borda) solid var(--linha-forte);background:var(--cartao);padding:9px 12px;font-size:max(16px,1rem)}
.campo textarea{min-height:88px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:3px solid color-mix(in srgb,var(--acao) 22%,transparent);border-color:var(--acao)}
.campo.invalido input,.campo.invalido select{border-color:var(--erro)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--acao);flex:none}

/* ---------- painel (de baixo no celular; lateral no computador) ---------- */
.fundo{position:fixed;inset:0;background:rgba(10,12,16,.38);z-index:60;opacity:0;transition:opacity .2s}
.fundo.on{opacity:1}
.painel{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--papel);border-radius:16px 16px 0 0;max-height:92vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:var(--sombra-flutua);max-width:720px;margin:0 auto;border:var(--borda) solid var(--linha);border-bottom:0}
.painel.on{transform:none}
.painel .alca{padding:8px 0 2px;display:grid;place-items:center;cursor:grab;touch-action:none}
.painel .alca i{width:36px;height:4px;border-radius:2px;background:var(--linha-forte)}
.painel .cab{display:flex;align-items:center;gap:8px;padding:4px 16px 10px}
.painel .cab h2{flex:1;font-size:1.13rem}
.painel .cab .icone-btn{width:32px;height:32px;border:0;background:var(--cartao2);color:var(--tinta2)}
.painel .conteudo{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.painel .rodape{border-top:var(--borda) solid var(--linha);background:var(--cartao);padding:10px 16px calc(12px + var(--sb));display:flex;flex-direction:column;gap:6px}
.painel .rodape .btn{min-height:44px}
.painel .rodape .falta{font-size:.82rem;color:var(--erro);font-weight:500}
.painel .rodape .total{display:flex;justify-content:space-between;align-items:center;font-weight:600}

/* ---------- avisos rápidos ---------- */
.torrada{position:fixed;left:12px;right:12px;bottom:calc(var(--barra) + var(--sb) + 12px);z-index:80;max-width:480px;margin:0 auto;background:var(--tinta);color:var(--papel);
  border-radius:10px;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--sombra-flutua);font-size:.9rem;animation:sobe .2s}
.torrada button{background:none;border:0;color:color-mix(in srgb,var(--acao) 55%,var(--papel));font-weight:600;min-height:36px;padding:0 8px;cursor:pointer}
@keyframes sobe{from{transform:translateY(16px);opacity:0}}
.torrada.no-topo{bottom:auto;top:calc(var(--st) + 10px);z-index:90}

/* ---------- esqueleto ---------- */
.esq{background:linear-gradient(90deg,var(--cartao2) 0%,var(--cartao) 50%,var(--cartao2) 100%);background-size:200% 100%;animation:brilho 1.2s infinite;border-radius:var(--raio);height:76px;margin-bottom:12px}
@keyframes brilho{to{background-position:-200% 0}}

/* ---------- bilhetes (reservas) ---------- */
.bilhete{position:relative;background:var(--cartao);border:var(--borda) solid var(--linha);border-radius:var(--raio);margin-bottom:12px;cursor:pointer;overflow:hidden}
.bilhete:hover{border-color:var(--linha-forte)}
.bilhete .b1{padding:12px 14px 10px;display:flex;gap:12px;align-items:flex-start}
.bilhete .b2{border-top:1px dashed var(--linha-forte);padding:10px 14px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.bilhete .b2::before,.bilhete .b2::after{content:"";position:absolute;top:-8px;width:14px;height:14px;border-radius:50%;background:var(--papel);border:var(--borda) solid var(--linha)}
.bilhete .b2::before{left:-8px} .bilhete .b2::after{right:-8px}
.codigo{font-family:var(--mono);font-size:1.07rem;font-weight:500;letter-spacing:.05em}
.codigo-gigante{font-family:var(--mono);font-size:1.9rem;font-weight:500;letter-spacing:.1em;text-align:center;padding:18px 8px;border:1px dashed var(--linha-forte);border-radius:var(--raio);margin:10px 0;background:var(--cartao);word-break:break-all}

/* ---------- roteiro ---------- */
.dias{display:flex;gap:4px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none;position:sticky;top:var(--topo);background:var(--papel);z-index:5;border-bottom:var(--borda) solid var(--linha);margin:-16px -16px 14px;padding-left:14px;padding-right:14px}
.dias::-webkit-scrollbar{display:none}
.dia{flex:none;width:46px;text-decoration:none;color:var(--tinta);border-radius:10px;border:0;background:none;padding:6px 0 8px;text-align:center;cursor:pointer;position:relative}
.dia:hover{background:var(--cartao2);text-decoration:none}
.dia b{display:block;font-family:var(--titulo);font-size:1rem;font-weight:500}
.dia small{display:block;font-size:.7rem;color:var(--tinta2);font-weight:400}
.dia i{position:absolute;left:14px;right:14px;bottom:3px;height:2px;border-radius:1px}
.dia.on{background:var(--tinta);color:var(--papel)} .dia.on small{color:inherit;opacity:.7}
.dia.hoje::after{content:"";position:absolute;top:5px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--acao)}
.linha-tempo{position:relative;padding-left:22px}
.linha-tempo::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:1px;background:var(--linha-forte)}
.ativ{position:relative}
.ativ::before{content:"";position:absolute;left:-18px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--cor,var(--acao));box-shadow:0 0 0 3px var(--papel)}
.ativ .alca-arr{width:32px;height:40px;display:grid;place-items:center;color:var(--tinta3);cursor:grab;touch-action:none;flex:none;font-size:1rem}
.deslocamento{font-size:.82rem;color:var(--tinta2);margin:-4px 0 10px 4px}
.sortable-ghost{opacity:.4}

/* ---------- mapa ---------- */
.mapa-casca{position:relative;height:calc(100dvh - var(--topo) - var(--st) - var(--barra) - var(--sb));min-height:360px}
#mapa{position:absolute;inset:0;background:var(--cartao2)}
.mapa-filtros{position:absolute;top:10px;left:10px;right:10px;z-index:3}
.mapa-filtros .chips{padding-bottom:4px}
.mapa-filtros .chip{box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mapa-acoes{position:absolute;right:10px;z-index:3;display:flex;flex-direction:column;gap:8px}
.mapa-acoes .icone-btn{box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mapa-lista{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--papel);border-radius:16px 16px 0 0;box-shadow:var(--sombra-flutua);border-top:var(--borda) solid var(--linha);display:flex;flex-direction:column;transition:height .2s;height:34%}
.mapa-lista[data-pos="0"]{height:72px} .mapa-lista[data-pos="2"]{height:82%}
.mapa-lista .conteudo{overflow-y:auto;padding:0 12px 12px;flex:1}
.mapa-aviso{position:absolute;left:50%;transform:translateX(-50%);top:56px;z-index:3;background:var(--alerta-suave);color:var(--tinta);border:1px solid color-mix(in srgb,var(--alerta) 40%,transparent);border-radius:999px;padding:3px 12px;font-size:.8rem}
@media (min-width:900px){
  .mapa-casca{display:grid;grid-template-columns:1fr 380px;grid-template-rows:minmax(0,1fr)}
  #mapa{position:relative;inset:auto;height:100%}
  .mapa-lista{position:relative;height:100%!important;min-height:0;border-radius:0;border-left:var(--borda) solid var(--linha);border-top:0;box-shadow:none}
  .mapa-lista .alca{display:none}
  .mapa-filtros{right:390px} .mapa-acoes{right:392px}
}
.marcador{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer}
.marcador span{display:block;transform:rotate(45deg);font-size:14px;line-height:1}
.marcador.ideia{opacity:.75;border-style:dashed}
.marcador.num span{font-weight:600;color:#fff;font-size:13px;font-family:var(--fonte)}
.grupo-mk{min-width:34px;height:34px;padding:0 8px;border-radius:17px;background:var(--tinta);color:var(--papel);display:grid;place-items:center;font-weight:600;font-size:.87rem;border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.3);cursor:pointer}
.eu-mk{width:16px;height:16px;border-radius:50%;background:#2445c4;border:3px solid #fff;box-shadow:0 0 0 6px rgba(36,69,196,.22)}
.maplibregl-ctrl-attrib{font-size:10px!important}

/* ---------- login ---------- */
.login{max-width:400px;margin:0 auto;padding:calc(var(--st) + 40px) 20px 40px}
.marca{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.marca .logo{width:44px;height:44px;border-radius:12px;background:var(--tinta);display:grid;place-items:center}
.pessoas{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.pessoa-btn{min-height:88px;border-radius:var(--raio);border:var(--borda) solid var(--linha);background:var(--cartao);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:500;cursor:pointer;color:var(--tinta)}
.pessoa-btn:hover{border-color:var(--linha-forte)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:.93rem;background:var(--tinta2);flex:none}
.pin-pontos{display:flex;gap:14px;justify-content:center;margin:24px 0}
.pin-pontos i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--tinta)}
.pin-pontos i.on{background:var(--tinta)}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto}
.teclado button{min-height:56px;border-radius:12px;border:var(--borda) solid var(--linha);background:var(--cartao);font-size:1.33rem;font-weight:500;cursor:pointer;font-variant-numeric:tabular-nums}
.teclado button:active{background:var(--cartao2)}
.passos-instalar{counter-reset:p;padding:0;list-style:none}
.passos-instalar li{counter-increment:p;display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.passos-instalar li::before{content:counter(p);width:24px;height:24px;border-radius:50%;background:var(--cartao2);color:var(--tinta);display:grid;place-items:center;font-weight:600;font-size:.82rem;flex:none}

/* ---------- grade "Mais" (emojis grandes o bastante para achar de relance) ---------- */
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade a,.grade button{min-height:84px;border-radius:var(--raio);border:var(--borda) solid var(--linha);background:var(--cartao);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  text-decoration:none;color:var(--tinta);font-weight:500;font-size:.87rem;text-align:center;cursor:pointer;padding:8px}
.grade a:hover,.grade button:hover{border-color:var(--linha-forte);text-decoration:none}
.grade .ic{font-size:1.33rem;line-height:1}

/* ---------- barras de orçamento ---------- */
.barra-orc{height:4px;border-radius:2px;background:var(--cartao2);overflow:hidden;margin-top:8px}
.barra-orc i{display:block;height:100%;background:var(--acao);border-radius:2px}
.barra-orc i.alerta{background:var(--alerta)} .barra-orc i.erro{background:var(--erro)}

/* ---------- valor da despesa ---------- */
.valor-grande{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:8px 0 16px;padding-bottom:10px;border-bottom:1px solid var(--linha)}
.valor-grande:focus-within{border-bottom-color:var(--acao)}
.valor-grande .moeda{font-family:var(--mono);font-weight:500;font-size:.87rem;color:var(--tinta2);background:none;border:var(--borda) solid var(--linha-forte);border-radius:6px;padding:4px 8px;min-height:32px;cursor:pointer}
.valor-grande input{font-family:var(--titulo);font-size:2.4rem;font-weight:500;letter-spacing:-.02em;border:0;background:none;width:100%;max-width:240px;text-align:center;padding:0;min-height:52px;font-variant-numeric:tabular-nums}
.valor-grande input:focus{outline:none}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.cats button{min-height:60px;border-radius:10px;border:var(--borda) solid var(--linha);background:var(--cartao);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.75rem;font-weight:500;cursor:pointer;padding:4px;line-height:1.15;color:var(--tinta)}
.cats button span{font-size:1.15rem}
.cats button.on{border-color:var(--acao);background:var(--acao-suave);box-shadow:inset 0 0 0 1px var(--acao)}
.resumo-linha{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-radius:var(--raio-p);background:var(--cartao2);cursor:pointer;font-size:.87rem;margin-bottom:12px}
.resumo-linha b{font-weight:600}
.parte{display:grid;grid-template-columns:24px 1fr 96px;gap:10px;align-items:center;min-height:44px;border-bottom:var(--borda) solid var(--linha)}
.parte input[type=number]{min-height:36px;border-radius:6px;border:var(--borda) solid var(--linha-forte);background:var(--cartao);padding:4px 8px;width:100%;text-align:right}
.parte input[type=checkbox]{width:20px;height:20px;accent-color:var(--acao)}
@media (max-width:360px){ .cats{grid-template-columns:repeat(3,1fr)} .grade{grid-template-columns:repeat(2,1fr)} }

/* =====================================================================
   Computador (a partir de 1024px): menu lateral fixo, painéis à direita
   ===================================================================== */
@media (min-width:1024px){
  #app{padding-left:var(--lateral)}
  .topo{padding:10px 24px 10px 20px;min-height:60px}
  main{max-width:880px;padding:28px 32px 48px}
  .dias{margin:-28px -32px 18px;padding-left:28px;padding-right:28px;top:60px}
  .barra{top:0;bottom:0;left:0;right:auto;width:var(--lateral);height:auto;margin:0;border:0;border-right:var(--borda) solid var(--linha);border-radius:0;background:var(--cartao);
    display:flex;flex-direction:column;align-items:stretch;padding:16px 12px;gap:2px;backdrop-filter:none;-webkit-backdrop-filter:none}
  .barra .so-pc{display:flex!important}
  .barra .rotulo-lateral{font-size:.73rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta3);padding:18px 10px 6px}
  .barra::before{order:-2;content:"Rumo";font-family:var(--titulo);font-weight:600;font-size:1.07rem;letter-spacing:-.01em;padding:6px 10px 16px;color:var(--tinta)}
  .barra a{flex-direction:row;justify-content:flex-start;gap:10px;min-height:36px;padding:0 10px;border-radius:6px;font-size:.93rem;color:var(--tinta2)}
  .barra a:hover{background:var(--cartao2);text-decoration:none}
  .barra a .ic{font-size:1rem}
  .barra a.ativo{background:var(--cartao2);color:var(--tinta)}
  .barra>div{order:-1;display:block;margin:0 0 14px}
  .fab{width:100%;height:38px;padding:0 12px;border-radius:var(--raio-p);display:flex;align-items:center;justify-content:center;gap:8px;font-size:.93rem;font-weight:500}
  .fab:hover{background:color-mix(in srgb,var(--acao) 88%,#000)}
  .fab .ico{width:16px;height:16px}
  .fab .fab-txt{display:inline}
  .torrada{bottom:24px;left:calc(var(--lateral) + 24px)}
  .painel{left:auto;top:0;bottom:0;right:0;width:460px;max-width:none;max-height:none;border-radius:0;border:0;border-left:var(--borda) solid var(--linha);transform:translateX(100%)}
  .painel.on{transform:none}
  .painel .alca{display:none}
  .painel .cab{padding:18px 20px 12px}
  .painel .conteudo{padding:4px 20px 20px}
  .painel .rodape{padding:12px 20px 16px}
  .mapa-casca{height:calc(100dvh - 60px)}
  .grade{grid-template-columns:repeat(4,1fr)}
  .duo .medio{font-size:1.6rem}
}
@media (min-width:1280px){ main{max-width:960px} }
</style>
