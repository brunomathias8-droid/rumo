<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumo · viagem em grupo</title>
<meta name="description" content="Roteiro, mapa, reservas, contas e documentos da viagem — para a família toda, até sem internet.">
<meta name="theme-color" content="#f6f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rumo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* ---------- Paletas (Ajustes → Aparência). Cada paleta define tons claros e a cor de destaque do modo escuro ---------- */
:root{
  --p-papel:#f6f7f9; --p-cartao:#ffffff; --p-cartao2:#eef0f3; --p-tinta:#111827; --p-tinta2:#4b5563; --p-tinta3:#6b7280; --p-linha:#e3e6ea;
  --p-acao:#2563eb; --p-acao-suave:#dbe7fd; --p-acao-e:#60a5fa; --p-acao-e-txt:#0b1220;
}
:root[data-paleta="caderno"]{ --p-papel:#f5f0e6; --p-cartao:#fffdf8; --p-cartao2:#efe7d8; --p-tinta:#14213d; --p-tinta2:#3d4a63; --p-tinta3:#5b6478; --p-linha:#ddd3c2; --p-acao:#c2410c; --p-acao-suave:#fbe3d6; --p-acao-e:#fb923c; --p-acao-e-txt:#1b1206; }
:root[data-paleta="oceano"]{ --p-papel:#f2f7f8; --p-cartao:#ffffff; --p-cartao2:#e3eef0; --p-tinta:#0f2a33; --p-tinta2:#3d5a63; --p-tinta3:#5f7a82; --p-linha:#d3e2e5; --p-acao:#0e7490; --p-acao-suave:#d4eef3; --p-acao-e:#22d3ee; --p-acao-e-txt:#06232b; }
:root[data-paleta="floresta"]{ --p-papel:#f4f6f1; --p-cartao:#ffffff; --p-cartao2:#e7ece2; --p-tinta:#1c2a1f; --p-tinta2:#45564a; --p-tinta3:#66766a; --p-linha:#dbe2d5; --p-acao:#2f6b3f; --p-acao-suave:#dcebdf; --p-acao-e:#4ade80; --p-acao-e-txt:#0a2213; }
:root[data-paleta="terracota"]{ --p-papel:#faf6f2; --p-cartao:#ffffff; --p-cartao2:#f1e8df; --p-tinta:#2a1d16; --p-tinta2:#5a4639; --p-tinta3:#7a675a; --p-linha:#e8ddd2; --p-acao:#b4532a; --p-acao-suave:#f6dfd3; --p-acao-e:#fb923c; --p-acao-e-txt:#1f0f05; }
:root[data-paleta="ameixa"]{ --p-papel:#f8f6fa; --p-cartao:#ffffff; --p-cartao2:#efe9f4; --p-tinta:#22172b; --p-tinta2:#54465f; --p-tinta3:#74667f; --p-linha:#e4dcea; --p-acao:#7e22ce; --p-acao-suave:#ece0f8; --p-acao-e:#c084fc; --p-acao-e-txt:#1d0b2e; }
:root[data-paleta="grafite"]{ --p-papel:#f4f4f4; --p-cartao:#ffffff; --p-cartao2:#e9e9e9; --p-tinta:#111111; --p-tinta2:#444444; --p-tinta3:#666666; --p-linha:#dcdcdc; --p-acao:#111111; --p-acao-suave:#e5e5e5; --p-acao-e:#e5e5e5; --p-acao-e-txt:#111111; }
:root[data-paleta="rosa"]{ --p-papel:#fbf6f7; --p-cartao:#ffffff; --p-cartao2:#f4e8eb; --p-tinta:#2b1a1f; --p-tinta2:#5e4950; --p-tinta3:#7d6870; --p-linha:#ecdde1; --p-acao:#be185d; --p-acao-suave:#fbe1ec; --p-acao-e:#f472b6; --p-acao-e-txt:#2b0716; }

/* ---------- Fontes (Ajustes → Aparência). Padrão: a fonte do sistema (SF no iPhone, Roboto no Android) ---------- */
:root{ --fonte:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --titulo:var(--fonte); --peso-titulo:700; --espaco-titulo:-.015em; }
:root[data-fonte="inter"]{ --fonte:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
:root[data-fonte="plex"]{ --fonte:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --peso-titulo:600; }
:root[data-fonte="source"]{ --fonte:"Source Sans 3",-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
:root[data-fonte="classica"]{ --titulo:"Source Serif 4",Georgia,"Times New Roman",serif; --espaco-titulo:0; }
:root[data-fonte="editorial"]{ --titulo:"Fraunces",Georgia,"Times New Roman",serif; }

:root{
  --papel:var(--p-papel); --cartao:var(--p-cartao); --cartao2:var(--p-cartao2); --tinta:var(--p-tinta); --tinta2:var(--p-tinta2); --tinta3:var(--p-tinta3);
  --linha:var(--p-linha); --acao:var(--p-acao); --acao-txt:#fff; --acao-suave:var(--p-acao-suave);
  --ok:#15803d; --ok-suave:#dcf2e3; --alerta:#a16207; --alerta-suave:#fdf0cc; --erro:#b91c1c; --erro-suave:#fbe1e1; --info:#1d4ed8; --info-suave:#e0e8fb;
  --sombra:0 1px 2px rgba(17,24,39,.06),0 4px 14px rgba(17,24,39,.06);
  --raio:16px; --raio-p:10px; --borda:1px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  --barra:68px; --topo:56px;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]):not([data-tema="sol"]){
    --papel:#0f1115; --cartao:#181b22; --cartao2:#20242d; --tinta:#eceef1; --tinta2:#b8bec8; --tinta3:#8d94a0;
    --linha:#2b303a; --acao:var(--p-acao-e); --acao-txt:var(--p-acao-e-txt); --acao-suave:color-mix(in srgb,var(--p-acao-e) 18%,#181b22);
    --ok:#4ade80; --ok-suave:#12301f; --alerta:#fbbf24; --alerta-suave:#33280d; --erro:#f87171; --erro-suave:#3a1717; --info:#93b4ff; --info-suave:#17244a;
    --sombra:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-tema="escuro"]{
  --papel:#0f1115; --cartao:#181b22; --cartao2:#20242d; --tinta:#eceef1; --tinta2:#b8bec8; --tinta3:#8d94a0;
  --linha:#2b303a; --acao:var(--p-acao-e); --acao-txt:var(--p-acao-e-txt); --acao-suave:color-mix(in srgb,var(--p-acao-e) 18%,#181b22);
  --ok:#4ade80; --ok-suave:#12301f; --alerta:#fbbf24; --alerta-suave:#33280d; --erro:#f87171; --erro-suave:#3a1717; --info:#93b4ff; --info-suave:#17244a;
  --sombra:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
/* Modo Sol: contraste máximo para ler na rua, sem cinzas claros (mantém a cor de destaque da paleta) */
:root[data-tema="sol"]{
  --papel:#ffffff; --cartao:#ffffff; --cartao2:#f2f2f2; --tinta:#000; --tinta2:#000; --tinta3:#1a1a1a;
  --linha:#000; --acao-suave:#eeeeee; --ok:#0b5d24; --alerta:#6b3e00; --erro:#8a0f0f; --info:#0b2f9e;
  --borda:2px; --sombra:none;
}
:root[data-tema="sol"] body{font-weight:500}
:root[data-letra="1"]{font-size:112.5%} :root[data-letra="2"]{font-size:125%} :root[data-letra="3"]{font-size:137.5%}
.amostra-cor{display:flex;gap:4px;justify-content:center}
.amostra-cor i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.opcao.on{outline:3px solid var(--acao);border-color:var(--acao)!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--papel);color:var(--tinta);font-family:var(--fonte);font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
h1,h2,h3{font-family:var(--titulo);font-weight:var(--peso-titulo);letter-spacing:var(--espaco-titulo);margin:0}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
.mono{font-family:var(--mono)}
.peq{font-size:.85rem;color:var(--tinta2)} .mpeq{font-size:.78rem;color:var(--tinta3)}
.oculto{display:none!important}
.vazio{padding:28px 16px;text-align:center;color:var(--tinta2)}

/* ---------- casca ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.topo{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:calc(var(--st) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;border-bottom:var(--borda) solid var(--linha);min-height:var(--topo)}
.viagem-btn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;min-height:44px;text-align:left;cursor:pointer}
.viagem-btn .bola{width:30px;height:30px;border-radius:9px;background:var(--acao);color:var(--acao-txt);display:grid;place-items:center;font-weight:800;font-family:var(--titulo);flex:none}
.viagem-btn b{display:block;font-family:var(--titulo);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viagem-btn small{display:block;color:var(--tinta2);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pilula{border:var(--borda) solid var(--linha);background:var(--cartao);border-radius:999px;padding:0 12px;min-height:36px;display:inline-flex;align-items:center;gap:6px;font-size:.8rem;white-space:nowrap;cursor:pointer}
.pilula.off{background:var(--alerta-suave);border-color:var(--alerta);color:var(--alerta)}
.pilula.erro{background:var(--erro-suave);border-color:var(--erro);color:var(--erro)}
.icone-btn{width:44px;height:44px;border-radius:12px;border:var(--borda) solid var(--linha);background:var(--cartao);display:grid;place-items:center;cursor:pointer;flex:none;font-size:1.1rem}
main{flex:1;padding:14px 14px calc(var(--barra) + var(--sb) + 24px);width:100%;max-width:760px;margin:0 auto}
main.largo{max-width:none;padding:0}
.barra{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--cartao);border-top:var(--borda) solid var(--linha);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:var(--sb);height:calc(var(--barra) + var(--sb))}
.barra a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--tinta2);font-size:.72rem;font-weight:600;min-height:48px}
.barra a .ic{font-size:1.35rem;line-height:1}
.barra a.ativo{color:var(--acao)}
.barra .mais-btn{position:relative}
.fab{width:60px;height:60px;border-radius:20px;background:var(--acao);color:var(--acao-txt);border:0;font-size:2rem;line-height:1;box-shadow:0 6px 18px color-mix(in srgb,var(--acao) 40%,transparent);
  margin:-22px auto 0;display:grid;place-items:center;cursor:pointer}
@media (min-width:900px){ .barra{max-width:760px;margin:0 auto;border:var(--borda) solid var(--linha);border-bottom:0;border-radius:18px 18px 0 0} }

/* ---------- cartões ---------- */
.cartao{background:var(--cartao);border:var(--borda) solid var(--linha);border-radius:var(--raio);padding:14px;box-shadow:var(--sombra);margin-bottom:12px}
.cartao.toque{cursor:pointer}
.cartao h3{margin-bottom:4px}
.cartao-topo{display:flex;align-items:flex-start;gap:10px}
.cartao-topo>div{flex:1;min-width:0}
.rotulo{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2);margin:18px 2px 8px}
.secao-topo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 2px 8px}
.secao-topo .rotulo{margin:0}
.lista{background:var(--cartao);border:var(--borda) solid var(--linha);border-radius:var(--raio);overflow:hidden;margin-bottom:12px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;border-bottom:var(--borda) solid var(--linha);cursor:pointer;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.item:last-child{border-bottom:0}
.item>.corpo{flex:1;min-width:0}
.item .t{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:.84rem;color:var(--tinta2);display:block;overflow:hidden;text-overflow:ellipsis}
.item .v{font-weight:700;white-space:nowrap;text-align:right}
.emoji{width:40px;height:40px;border-radius:12px;background:var(--cartao2);display:grid;place-items:center;font-size:1.25rem;flex:none}
.etiqueta{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:.74rem;font-weight:700;background:var(--cartao2);color:var(--tinta2);white-space:nowrap}
.etiqueta.ok{background:var(--ok-suave);color:var(--ok)} .etiqueta.alerta{background:var(--alerta-suave);color:var(--alerta)} .etiqueta.erro{background:var(--erro-suave);color:var(--erro)} .etiqueta.info{background:var(--info-suave);color:var(--info)}
.pendente{opacity:.75} .pendente .t::after{content:" ⟳";font-size:.8em;color:var(--alerta)}
.grande{font-family:var(--titulo);font-size:2.6rem;line-height:1;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.valor-pos{color:var(--ok)} .valor-neg{color:var(--erro)}
.aviso{border-radius:var(--raio-p);padding:10px 12px;font-size:.9rem;margin-bottom:10px;border:var(--borda) solid}
.aviso.alerta{background:var(--alerta-suave);border-color:var(--alerta);color:var(--tinta)} .aviso.erro{background:var(--erro-suave);border-color:var(--erro)} .aviso.info{background:var(--info-suave);border-color:var(--info)}

/* ---------- botões e formulários ---------- */
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:var(--borda) solid var(--linha);background:var(--cartao);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--tinta)}
.btn.prim{background:var(--acao);border-color:var(--acao);color:var(--acao-txt)}
.btn.perigo{color:var(--erro);border-color:var(--erro)}
.btn.bloco{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.botoes{display:flex;gap:8px;flex-wrap:wrap}
.botoes .btn{flex:1 1 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:var(--borda) solid var(--linha);background:var(--cartao);font-weight:600;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.chip .pt{width:10px;height:10px;border-radius:50%;display:inline-block}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--cartao2);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{min-height:40px;border:0;border-radius:9px;background:none;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--tinta2)}
.seg button.on{background:var(--cartao);color:var(--tinta);box-shadow:var(--sombra)}
.campo{display:block;margin-bottom:14px}
.campo>span{display:block;font-size:.82rem;font-weight:700;color:var(--tinta2);margin-bottom:5px}
.campo>span .obr{color:var(--acao)}
.campo input,.campo select,.campo textarea{width:100%;min-height:48px;border-radius:12px;border:var(--borda) solid var(--linha);background:var(--cartao);padding:10px 12px;font-size:1rem}
.campo textarea{min-height:90px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:3px solid color-mix(in srgb,var(--acao) 35%,transparent);border-color:var(--acao)}
.campo.invalido input,.campo.invalido select{border-color:var(--erro)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--acao);flex:none}

/* ---------- painel inferior (bottom sheet) ---------- */
.fundo{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:60;opacity:0;transition:opacity .2s}
.fundo.on{opacity:1}
.painel{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--papel);border-radius:22px 22px 0 0;max-height:92vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 30px rgba(0,0,0,.18);max-width:760px;margin:0 auto}
.painel.on{transform:none}
.painel .alca{padding:10px 0 4px;display:grid;place-items:center;cursor:grab;touch-action:none}
.painel .alca i{width:44px;height:5px;border-radius:3px;background:var(--linha)}
.painel .cab{display:flex;align-items:center;gap:8px;padding:0 16px 10px}
.painel .cab h2{flex:1;font-size:1.2rem}
.painel .conteudo{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.painel .rodape{border-top:var(--borda) solid var(--linha);background:var(--cartao);padding:10px 16px calc(10px + var(--sb));display:flex;flex-direction:column;gap:6px}
.painel .rodape .falta{font-size:.82rem;color:var(--erro);font-weight:600}
.painel .rodape .total{display:flex;justify-content:space-between;align-items:center;font-weight:700}

/* ---------- avisos rápidos ---------- */
.torrada{position:fixed;left:12px;right:12px;bottom:calc(var(--barra) + var(--sb) + 12px);z-index:80;max-width:520px;margin:0 auto;background:var(--tinta);color:var(--papel);
  border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:.92rem;animation:sobe .2s}
.torrada button{background:none;border:0;color:var(--acao);font-weight:800;min-height:40px;padding:0 8px;cursor:pointer;filter:brightness(1.4)}
@keyframes sobe{from{transform:translateY(20px);opacity:0}}
.torrada.no-topo{bottom:auto;top:calc(var(--st) + 10px);z-index:90}

/* ---------- esqueleto ---------- */
.esq{background:linear-gradient(90deg,var(--cartao2) 0%,var(--cartao) 50%,var(--cartao2) 100%);background-size:200% 100%;animation:brilho 1.2s infinite;border-radius:var(--raio);height:84px;margin-bottom:12px}
@keyframes brilho{to{background-position:-200% 0}}

/* ---------- bilhetes (reservas) ---------- */
.bilhete{position:relative;background:var(--cartao);border:var(--borda) solid var(--linha);border-radius:var(--raio);margin-bottom:12px;box-shadow:var(--sombra);cursor:pointer;overflow:hidden}
.bilhete .b1{padding:12px 14px 10px;display:flex;gap:12px;align-items:flex-start}
.bilhete .b2{border-top:2px dashed var(--linha);padding:10px 14px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.bilhete .b2::before,.bilhete .b2::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--papel);border:var(--borda) solid var(--linha)}
.bilhete .b2::before{left:-11px} .bilhete .b2::after{right:-11px}
.codigo{font-family:var(--mono);font-size:1.3rem;font-weight:700;letter-spacing:.06em}
.codigo-gigante{font-family:var(--mono);font-size:2.2rem;font-weight:700;letter-spacing:.1em;text-align:center;padding:18px 8px;border:2px dashed var(--linha);border-radius:var(--raio);margin:10px 0;background:var(--cartao);word-break:break-all}

/* ---------- roteiro ---------- */
.dias{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;position:sticky;top:var(--topo);background:var(--papel);z-index:5}
.dias::-webkit-scrollbar{display:none}
.dia{flex:none;width:58px;text-decoration:none;color:var(--tinta);border-radius:14px;border:var(--borda) solid var(--linha);background:var(--cartao);padding:6px 0;text-align:center;cursor:pointer;position:relative}
.dia b{display:block;font-family:var(--titulo);font-size:1.25rem}
.dia small{display:block;font-size:.68rem;color:var(--tinta2);text-transform:uppercase;font-weight:700}
.dia i{position:absolute;left:10px;right:10px;bottom:4px;height:3px;border-radius:2px}
.dia.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta)} .dia.on small{color:inherit;opacity:.8}
.dia.hoje::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--acao)}
.linha-tempo{position:relative;padding-left:22px}
.linha-tempo::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--linha)}
.ativ{position:relative}
.ativ::before{content:"";position:absolute;left:-19px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--cor,var(--acao));border:2px solid var(--papel)}
.ativ .alca-arr{width:40px;height:44px;display:grid;place-items:center;color:var(--tinta3);cursor:grab;touch-action:none;flex:none;font-size:1.2rem}
.deslocamento{font-size:.8rem;color:var(--tinta2);margin:-4px 0 10px 4px}
.sortable-ghost{opacity:.4}

/* ---------- mapa ---------- */
.mapa-casca{position:relative;height:calc(100dvh - var(--topo) - var(--st) - var(--barra) - var(--sb));min-height:360px}
#mapa{position:absolute;inset:0;background:var(--cartao2)}
.mapa-filtros{position:absolute;top:10px;left:10px;right:10px;z-index:3}
.mapa-filtros .chips{padding-bottom:4px}
.mapa-filtros .chip{box-shadow:var(--sombra)}
.mapa-acoes{position:absolute;right:10px;z-index:3;display:flex;flex-direction:column;gap:8px}
.mapa-lista{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--papel);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.15);display:flex;flex-direction:column;transition:height .2s;height:34%}
.mapa-lista[data-pos="0"]{height:76px} .mapa-lista[data-pos="2"]{height:82%}
.mapa-lista .conteudo{overflow-y:auto;padding:0 12px 12px;flex:1}
.mapa-aviso{position:absolute;left:50%;transform:translateX(-50%);top:60px;z-index:3;background:var(--alerta-suave);color:var(--tinta);border:1px solid var(--alerta);border-radius:999px;padding:4px 12px;font-size:.8rem}
@media (min-width:900px){
  .mapa-casca{display:grid;grid-template-columns:1fr 380px;grid-template-rows:minmax(0,1fr)}
  #mapa{position:relative;inset:auto;height:100%}
  .mapa-lista{position:relative;height:100%!important;min-height:0;border-radius:0;border-left:var(--borda) solid var(--linha);box-shadow:none}
  .mapa-lista .alca{display:none}
  .mapa-filtros{right:390px} .mapa-acoes{right:392px}
}
.marcador{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer}
.marcador span{display:block;transform:rotate(45deg);font-size:16px;line-height:1}
.marcador.ideia{opacity:.75;border-style:dashed}
.marcador.num span{font-weight:800;color:#fff;font-size:14px;font-family:var(--fonte)}
.grupo-mk{min-width:38px;height:38px;padding:0 8px;border-radius:19px;background:var(--tinta);color:var(--papel);display:grid;place-items:center;font-weight:800;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer}
.eu-mk{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.25)}
.maplibregl-ctrl-attrib{font-size:10px!important}

/* ---------- login ---------- */
.login{max-width:440px;margin:0 auto;padding:calc(var(--st) + 28px) 18px 40px}
.marca{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.marca .logo{width:52px;height:52px;border-radius:16px;background:var(--tinta);display:grid;place-items:center}
.pessoas{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.pessoa-btn{min-height:96px;border-radius:var(--raio);border:var(--borda) solid var(--linha);background:var(--cartao);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:700;cursor:pointer}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.1rem;background:var(--tinta2);flex:none}
.pin-pontos{display:flex;gap:14px;justify-content:center;margin:22px 0}
.pin-pontos i{width:16px;height:16px;border-radius:50%;border:2px solid var(--tinta)}
.pin-pontos i.on{background:var(--tinta)}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
.teclado button{min-height:64px;border-radius:18px;border:var(--borda) solid var(--linha);background:var(--cartao);font-size:1.5rem;font-weight:700;cursor:pointer}
.passos-instalar{counter-reset:p;padding:0;list-style:none}
.passos-instalar li{counter-increment:p;display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.passos-instalar li::before{content:counter(p);width:28px;height:28px;border-radius:50%;background:var(--acao);color:var(--acao-txt);display:grid;place-items:center;font-weight:800;flex:none}

/* ---------- grade "Mais" ---------- */
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grade a,.grade button{min-height:92px;border-radius:var(--raio);border:var(--borda) solid var(--linha);background:var(--cartao);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  text-decoration:none;color:var(--tinta);font-weight:700;font-size:.86rem;text-align:center;cursor:pointer;padding:8px}
.grade .ic{font-size:1.6rem}

/* ---------- barras de orçamento ---------- */
.barra-orc{height:10px;border-radius:5px;background:var(--cartao2);overflow:hidden;margin-top:6px}
.barra-orc i{display:block;height:100%;background:var(--ok);border-radius:5px}
.barra-orc i.alerta{background:var(--alerta)} .barra-orc i.erro{background:var(--erro)}

/* ---------- valor da despesa ---------- */
.valor-grande{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:6px 0 14px}
.valor-grande .moeda{font-weight:800;font-size:1.3rem;color:var(--tinta2);background:var(--cartao2);border:0;border-radius:10px;padding:6px 10px;min-height:44px;cursor:pointer}
.valor-grande input{font-family:var(--titulo);font-size:3rem;font-weight:700;border:0;background:none;width:100%;max-width:240px;text-align:center;padding:0;min-height:64px}
.valor-grande input:focus{outline:none}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cats button{min-height:72px;border-radius:14px;border:var(--borda) solid var(--linha);background:var(--cartao);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.7rem;font-weight:700;cursor:pointer;padding:4px;line-height:1.15}
.cats button span{font-size:1.4rem}
.cats button.on{border-color:var(--acao);background:var(--acao-suave);outline:2px solid var(--acao)}
.resumo-linha{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-radius:12px;background:var(--cartao2);cursor:pointer;font-size:.86rem;margin-bottom:12px}
.resumo-linha b{font-weight:700}
.parte{display:grid;grid-template-columns:28px 1fr 96px;gap:10px;align-items:center;min-height:48px;border-bottom:var(--borda) solid var(--linha)}
.parte input[type=number]{min-height:40px;border-radius:10px;border:var(--borda) solid var(--linha);background:var(--cartao);padding:6px 8px;width:100%;text-align:right}
.parte input[type=checkbox]{width:22px;height:22px;accent-color:var(--acao)}
@media (max-width:360px){ .cats{grid-template-columns:repeat(3,1fr)} .grade{grid-template-columns:repeat(2,1fr)} }
